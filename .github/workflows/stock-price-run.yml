name: Stock Price Run

on:
  schedule:
    # 14:00 America/Los_Angeles (PST, UTC-8), weekdays
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market_date:
        description: "Market date to update prices for (YYYY-MM-DD). Leave blank to use today's market date."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run stock-price job
        working-directory: jobs
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKET_DATE: ${{ inputs.market_date }}
        run: go run ./cron/stock-price
