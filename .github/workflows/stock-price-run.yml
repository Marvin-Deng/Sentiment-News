name: Stock Price Run

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "Market date to update prices for (YYYY-MM-DD). Leave blank to use today's market date."
        required: false
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Decode service account key
        run: echo "${{ secrets.GCP_SA_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/gcp-sa-key.json"

      - name: Run stock-price job
        working-directory: jobs/stock-price
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa-key.json
          MARKET_DATE: ${{ inputs.market_date }}
        run: go run .
