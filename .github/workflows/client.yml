name: Deploy FE

on:
  push:
    branches:
      - main
    paths:
      - client/**
      - infra/client/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  REPOSITORY: client
  SERVICE: client

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET="gs://${{ secrets.GCP_PROJECT_ID }}-tfstate"
          gsutil ls -b "$BUCKET" >/dev/null 2>&1 || \
            gsutil mb -p "${{ secrets.GCP_PROJECT_ID }}" -l "${{ env.REGION }}" "$BUCKET"

      - name: Terraform init
        working-directory: infra/client
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_PROJECT_ID }}-tfstate"

      - name: Import pre-existing resources into state
        working-directory: infra/client
        run: |
          terraform import google_project_service.artifact_registry \
            "${{ secrets.GCP_PROJECT_ID }}/artifactregistry.googleapis.com" || true
          terraform import google_artifact_registry_repository.client \
            "projects/${{ secrets.GCP_PROJECT_ID }}/locations/${{ env.REGION }}/repositories/client" || true
          terraform import google_project_service.run \
            "${{ secrets.GCP_PROJECT_ID }}/run.googleapis.com" || true
          terraform import google_cloud_run_v2_service.client \
            "projects/${{ secrets.GCP_PROJECT_ID }}/locations/${{ env.REGION }}/services/client" || true
          terraform import google_cloud_run_v2_service_iam_member.public_access \
            "projects/${{ secrets.GCP_PROJECT_ID }}/locations/${{ env.REGION }}/services/client roles/run.invoker allUsers" || true
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_image: placeholder

      - name: Create Artifact Registry repository
        working-directory: infra/client
        run: |
          terraform apply -auto-approve \
            -target=google_project_service.artifact_registry \
            -target=google_artifact_registry_repository.client \
            -var="image=placeholder"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: client
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Terraform apply (create/update service)
        working-directory: infra/client
        run: terraform apply -auto-approve -var="image=${{ env.IMAGE }}"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Terraform apply (set app URL now that service exists)
        working-directory: infra/client
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          terraform apply -auto-approve \
            -var="image=${{ env.IMAGE }}" \
            -var="app_url=$SERVICE_URL"
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
